[menu]
# Pull-down menus: gray card, 1px black frame, solid highlight bar on the
# selected row. OS 9 never dimmed the desktop behind a menu, so scrim is off.
background                = "#DDDDDD"
background-alpha          = 1.0
text                      = "#000000"
border                    = "#000000"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.0
selected-background       = "#AABEDC"
selected-background-alpha = 1.0
selected-text             = "#000000"
selected-border           = "#AABEDC"
selected-border-alpha     = 0.0

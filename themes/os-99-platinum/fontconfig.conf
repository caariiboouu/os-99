<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  OS 9 Platinum typography.

  Linked into ~/.config/fontconfig/conf.d/ as 60-os9-fonts.conf by
  hooks/theme-set.d/os9-gtk.sh while an OS 9 theme is active, and removed when
  switching away. It deliberately does NOT touch ~/.config/fontconfig/fonts.conf;
  that file belongs to `omarchy font set`, and writing both would make the two
  fight.

  Mac OS 9.2 used four faces, and this file puts each one where Apple put it:

    Charcoal   system font: menus, window titles, buttons. Set directly by the
               j.os9-font shell plugin and by gsettings, not from here.
    Geneva     small point sizes and general text            -> sans-serif
    New York   the document serif                            -> serif
    Monaco     fixed-width, Terminal and code                -> monospace

  Geneva and New York are PIXEL fonts. Each file is one bitmap strike traced to
  outlines, so it is exact only at its own size and at integer multiples. Rather
  than scale one file to everything, the rules below pick the nearest strike.

  THREE passes are needed to do that, because there is no single size property
  to test:

    1. An unconditional default, so a request with no size at all still lands on
       a real family. Without it the pattern carries a family name that no font
       provides and the match falls straight through to Liberation Sans.
    2. A pixelsize pass, for callers that ask in device pixels.
    3. A size pass, for callers that ask in points. This is the common case:
       fontconfig derives pixelsize from size in FcDefaultSubstitute, which runs
       AFTER this config, so at rule time a normal app pattern has size and no
       pixelsize. Point thresholds are the pixel ones times 0.75 (72/96).

  Each pass uses prepend_first and the passes run in that order, so the most
  specific match ends up at the head of the family list and the default sits
  behind it as a floor.

  The edits bind STRONG on purpose. A weak family loses fontconfig's match
  scoring to any strong family already in the list, so a weak "Geneva 12" gets
  substituted into the pattern and then passed over for Liberation Sans.

  To turn all of this off without unloading the theme, delete the symlink:
      rm ~/.config/fontconfig/conf.d/60-os9-fonts.conf && fc-cache -f
-->
<fontconfig>

  <!-- Generic families. prepend_first, so the stock fallback chain survives
       underneath and any glyph these faces lack still resolves. -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Monaco</string></edit>
  </match>

  <!-- Pass 1: default strike, so a sizeless request still resolves. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 12</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 12</string></edit>
  </match>

  <!-- Pass 2: callers that ask in device pixels. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="less"><double>10</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 9</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="more_eq"><double>10</double></test>
    <test name="pixelsize" compare="less"><double>12</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 10</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="more_eq"><double>12</double></test>
    <test name="pixelsize" compare="less"><double>14</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 12</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="more_eq"><double>14</double></test>
    <test name="pixelsize" compare="less"><double>18</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 14</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="more_eq"><double>18</double></test>
    <test name="pixelsize" compare="less"><double>20</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 18</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="pixelsize" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 20</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="pixelsize" compare="less"><double>15</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 12</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="pixelsize" compare="more_eq"><double>15</double></test>
    <test name="pixelsize" compare="less"><double>17</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 15</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="pixelsize" compare="more_eq"><double>17</double></test>
    <test name="pixelsize" compare="less"><double>21</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 17</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="pixelsize" compare="more_eq"><double>21</double></test>
    <test name="pixelsize" compare="less"><double>26</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 21</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="pixelsize" compare="more_eq"><double>26</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 26</string></edit>
  </match>

  <!-- Pass 3: callers that ask in points, which is nearly all of them. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="less"><double>7.5</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 9</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="more_eq"><double>7.5</double></test>
    <test name="size" compare="less"><double>9</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 10</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="more_eq"><double>9</double></test>
    <test name="size" compare="less"><double>10.5</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 12</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="more_eq"><double>10.5</double></test>
    <test name="size" compare="less"><double>13.5</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 14</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="more_eq"><double>13.5</double></test>
    <test name="size" compare="less"><double>15</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 18</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Geneva</string></test>
    <test name="size" compare="more_eq"><double>15</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Geneva 20</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="size" compare="less"><double>11.25</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 12</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="size" compare="more_eq"><double>11.25</double></test>
    <test name="size" compare="less"><double>12.75</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 15</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="size" compare="more_eq"><double>12.75</double></test>
    <test name="size" compare="less"><double>15.75</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 17</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="size" compare="more_eq"><double>15.75</double></test>
    <test name="size" compare="less"><double>19.5</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 21</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>New York</string></test>
    <test name="size" compare="more_eq"><double>19.5</double></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>New York 26</string></edit>
  </match>

  <!-- Pixel faces render as pixels. Antialiasing a traced bitmap only blurs the
       stems it was drawn to keep sharp, and full hinting snaps them back onto
       the grid. Same treatment 99-os9-chicago.conf already gives Charcoal.
       Monaco is a real hinted outline face and keeps normal antialiasing. -->
  <match target="font">
    <test name="family" qual="any" compare="contains"><string>Geneva</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
  <match target="font">
    <test name="family" qual="any" compare="contains"><string>New York</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

</fontconfig>

[popups]
# Light, matching Noir's light chrome -- the bar, its tray menus and every
# Ui/Dropdown sit on this surface and draw the BAR's black text on it.
#
# This can only be light because the OSD no longer reads colors.toml. Omarchy's
# stock OSD draws Color.popups.text on Color.background, which in Noir is the
# dark #2B2B2B content colour; that made black popup text 1.48:1 and could not
# be fixed here, because popups.text also has to stay dark for the dropdowns.
# The j.osd plugin clone repoints the OSD at popups.background, which removes
# the conflict and lets all three surfaces agree. See shell-plugin/j.osd.
background       = "#DDDDDD"
background-alpha = 1.0
text             = "#000000"
border           = "#000000"
border-alpha     = 1.0
border-width     = 1

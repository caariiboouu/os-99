# hyprpm manifest.
#
# The theme needs a modified hyprbars: stock hyprbars fills the title bar with a
# solid rect, so it cannot draw a pinstripe, and Hyprland's own border
# interpolates a single gradient across the whole window, so it can never put a
# crisp 1px highlight on the top-left and a 1px shadow on the bottom-right.
#
# The plugin source lives in plugin/hyprbars rather than in a separate fork
# repository, so there is ONE url to install and one place to file issues.
# hyprpm builds it against whatever Hyprland you are running.
#
#     hyprpm add https://github.com/caariiboouu/os-99
#     hyprpm enable hyprbars-os99
#     hyprpm reload -n
#
# It derives from hyprbars (BSD 3-Clause, Hypr Development) -- see
# plugin/LICENSE and plugin/README.md for what was changed and why. It still
# reports itself to Hyprland as `hyprbars`, because the Lua API it exposes is
# hl.plugin.hyprbars.* and the theme calls it by name, so it cannot be loaded
# alongside upstream hyprbars. Pick one.
#
# commit_pins map a Hyprland commit to the commit of THIS repository that
# hyprpm should check out and build for it. They are how a compositor-native
# plugin stops being "whatever HEAD happens to say today": on a pinned Hyprland,
# hyprpm resets to the named commit, so what gets compiled into the compositor
# is a fixed, reviewable tree rather than a moving branch.
#
# The second hash in a pin is a commit in THIS repository -- upstream's pins
# name commits in their own plugin repo, and ours name ours. Only plugin/ is
# built from it: the shell widget and the helpers arrive through the Omarchy
# plugin clone, not through hyprpm, so a pin binds the compiled .so and nothing
# else.
#
# The pin below is v0.56.2 -- the release this is developed and tested against --
# bound to the commit that tree was reviewed at. Every later change to plugin/
# needs a NEW pin entry to reach users on that Hyprland; that is the cost of the
# guarantee, and it is the right way round. Hyprland versions with no pin fall
# back to HEAD, because hyprpm offers nothing else for them; pins are added as
# each version is actually built and tested here.
#
# A pin naming a commit that is not PUSHED makes `hyprpm add` fail outright --
# it clones, reads this file, and checks the hash out. Pin and target ship
# together or not at all.

[repository]
name = "os-99"
authors = ["Vaxry", "Joel"]
commit_pins = [
    # Hyprland v0.56.2                        os-99
    ["efb50993780079460b0cbed1363e2166a2de1d9f", "b88b36031bc6af049acc59e22aa411d0e31b022b"],
]

[hyprbars-os99]
description = "hyprbars with nine-patch frame art: draws an OS 99 window frame around the whole window, not just a title bar"
authors = ["Vaxry", "Joel"]
output = "plugin/hyprbars/hyprbars.so"
build = [
    "make -C plugin/hyprbars all",
]
# Hyprland's own commit COUNT, not a version string -- `hyprctl version` prints
# it as "commits:". This fork calls APIs that do not exist further back
# (Config::Actions::fullscreenWindow with a window argument, IGeometric's
# GEOMETRIC_GOAL, m_ruleApplicator's per-window rounding), so on an older
# Hyprland it would not fail to work, it would fail to COMPILE -- and a wall of
# C++ errors is a poor way to learn you are on the wrong version. This makes
# hyprpm say so instead. 7661 is v0.56.2, the oldest release it is known to
# build against; it is a floor established by testing, not a guess at one.
since_hyprland = 7661
